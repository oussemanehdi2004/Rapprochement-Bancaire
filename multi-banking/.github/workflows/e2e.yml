name: E2E Full Stack

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # hebdo, lundi

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          cd fraud-detection
          echo "JWT_SECRET=e2e-secret-key-32-bytes-minimum" > .env
          docker compose up -d --build
      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8005/ && curl -fsS http://localhost:8010/health && break
            sleep 3
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r fraud-detection/e2e/requirements-e2e.txt
      - run: pytest fraud-detection/e2e/ -v
      - if: always()
        run: cd fraud-detection && docker compose logs && docker compose down -v