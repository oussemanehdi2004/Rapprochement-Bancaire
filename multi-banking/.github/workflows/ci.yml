name: Fraud Detection CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - "fraud-detection/backend/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "fraud-detection/backend/**"

defaults:
  run:
    working-directory: fraud-detection/backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: fraud-detection/backend/requirements*.txt
      - run: pip install ruff black
      - run: ruff check .
      - run: black --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    env:
      JWT_SECRET: ci-test-secret-key-not-for-prod-32b
      DISABLE_INTERNAL_AUTH: "true"
      ENABLE_TEST_TOKEN_ENDPOINT: "true"
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: fraud-detection/backend/requirements*.txt
      - run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - run: pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        with:
          name: fraud-detection-coverage
          path: fraud-detection/backend/coverage.xml
          retention-days: 14

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: fraud-detection/backend
          file: fraud-detection/backend/Dockerfile
          push: false
          tags: fraud-detection:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test /health
        run: |
          docker run -d --name fraud-ci \
            -e JWT_SECRET=ci-test-secret-key-not-for-prod-32b \
            -e DISABLE_INTERNAL_AUTH=true \
            -p 8005:8005 fraud-detection:ci-${{ github.sha }}
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8005/health && exit 0
            sleep 2
          done
          docker logs fraud-ci && exit 1