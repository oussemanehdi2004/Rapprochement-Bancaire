<div class="min-h-screen w-full max-w-full overflow-x-hidden bg-gray-50 dark:bg-gray-900">
  <app-sidebar (collapsedChange)="sidebarCollapsed.set($event)"></app-sidebar>

  <div
    class="pt-16 min-w-0 transition-[margin] duration-300 ease-in-out"
    [class.ml-64]="!sidebarCollapsed()"
    [class.ml-20]="sidebarCollapsed()"
  >
    <app-header [collapsed]="sidebarCollapsed()"></app-header>

    <main class="p-6 min-w-0 overflow-x-hidden">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
