<div class="min-h-screen w-full max-w-full overflow-x-hidden bg-[#F8FAFC] flex">
  <app-sidebar
    [mobileOpen]="mobileSidebarOpen()"
    (collapsedChange)="sidebarCollapsed.set($event)"
    (mobileClose)="mobileSidebarOpen.set(false)"
  ></app-sidebar>

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <app-header
      [collapsed]="sidebarCollapsed()"
      (menuClick)="mobileSidebarOpen.set(true)"
    ></app-header>

    <main class="flex-1 min-w-0 overflow-x-hidden bg-[#F8FAFC]">
      <router-outlet></router-outlet>
    </main>
  </div>

  <app-toast></app-toast>
</div>
