<!-- Mobile overlay -->
@if (mobileOpen()) {
  <div class="fixed inset-0 bg-black/40 z-30 lg:hidden" (click)="closeMobile()"></div>
}

<aside
  [class.w-20]="isCollapsed()"
  [class.w-64]="!isCollapsed()"
  [class.translate-x-0]="mobileOpen()"
  [class.-translate-x-full]="!mobileOpen()"
  class="bg-white border-r border-gray-200 h-screen flex flex-col transition-all duration-300 ease-in-out fixed left-0 top-0 z-40 dark:bg-gray-800 dark:border-gray-700 lg:relative lg:translate-x-0 lg:h-auto lg:flex-shrink-0"
>
  <!-- Logo -->
  <div class="p-4 border-b border-gray-200 dark:border-gray-700">
    <div class="flex items-center gap-3">
      <div class="h-10 w-10 bg-gradient-to-br from-blue-600 to-blue-800 rounded-xl flex items-center justify-center text-white font-bold text-lg">
        BM
      </div>
      @if (!isCollapsed()) {
        <div>
          <h1 class="font-bold text-gray-900 dark:text-white text-lg">BankMatch</h1>
          <p class="text-xs text-gray-500 dark:text-gray-400">Fraud Detection</p>
        </div>
      }
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 p-4 flex flex-col gap-2 overflow-y-auto">
    @for (item of menuItems; track $index) {
      <a
        [routerLink]="item.path"
        routerLinkActive="active-link"
        [attr.aria-current]="isRouteActive(item.path) ? 'page' : null"
        (click)="closeMobile()"
        class="flex items-center gap-3 p-3 rounded-lg text-gray-600 hover:bg-gray-100 transition-colors dark:text-gray-300 dark:hover:bg-gray-700 sidebar-link"
      >
        <span class="text-xl" [attr.aria-label]="item.label">{{ item.icon }}</span>
        @if (!isCollapsed()) {
          <div class="flex-1">
            <p class="font-medium text-sm">{{ item.label }}</p>
            <p class="text-xs text-gray-400 dark:text-gray-500">{{ item.description }}</p>
          </div>
        }
      </a>
    }
  </nav>

  <!-- Toggle Button -->
  <div class="p-4 border-t border-gray-200 dark:border-gray-700">
    <button
      (click)="toggleCollapse()"
      class="w-full flex items-center justify-center gap-2 p-2 rounded-lg text-gray-600 hover:bg-gray-100 transition-colors dark:text-gray-300 dark:hover:bg-gray-700 sidebar-toggle"
    >
      @if (isCollapsed()) {
        <span class="text-xl">→</span>
      } @else {
        <span class="text-xl">←</span>
        <span class="text-sm">Réduire</span>
      }
    </button>
  </div>
</aside>
