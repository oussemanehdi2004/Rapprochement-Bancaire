services:

  neo4j_db:
    image: neo4j:5.26-community
    container_name: neo4j_db
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password_super_securise
    volumes:
      - neo4j_data:/data
    networks:
      - banking_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 512M

  fraud-service:
    build: ./backend
    container_name: fraud_service
    ports:
      - "8005:8005"
    environment:
      - NEO4J_URI=bolt://neo4j_db:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password_super_securise
      - INTERNAL_SERVICE_SECRET=${FRAUD_INTERNAL_SECRET:-fraud_dev_secret_123}
      - DISABLE_INTERNAL_AUTH=true
      - JWT_SECRET=${JWT_SECRET}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - RATE_LIMIT_REQUESTS=30
      - RATE_LIMIT_PERIOD=60
    depends_on:
      - neo4j_db
    networks:
      - banking_net
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
        reservations:
          memory: 256M

  multi-banking:
    build: ../multi-banking
    container_name: multi_banking
    ports:
      - "8010:8010"
    environment:
      - FRAUD_SERVICE_URL=http://fraud-service:8005
      - INTERNAL_SERVICE_SECRET=${MULTIBANKING_INTERNAL_SECRET:-multibanking_dev_secret_456}
      - FRAUD_INTERNAL_SECRET=${FRAUD_INTERNAL_SECRET:-fraud_dev_secret_123}
      - DISABLE_INTERNAL_AUTH=true
      - JWT_SECRET=${JWT_SECRET}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    depends_on:
      - fraud-service
    networks:
      - banking_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/banking/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

  api-gateway:
    image: nginx:latest
    container_name: api_gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - multi-banking
      - fraud-service
    networks:
      - banking_net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks: [banking_net]

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin_dev_only
    networks: [banking_net]


networks:
  banking_net:

volumes:
  neo4j_data:

