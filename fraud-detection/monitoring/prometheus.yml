global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "fraud-detection"
    metrics_path: /metrics
    static_configs:
      - targets: ["fraud-service:8005"]

  - job_name: "multi-banking"
    metrics_path: /metrics
    static_configs:
      - targets: ["multi-banking:8010"]

  - job_name: "neo4j"
    static_configs:
      - targets: ["neo4j_db:2004"]