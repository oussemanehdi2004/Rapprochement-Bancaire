openapi: 3.0.3
info:
  title: API de Rapprochement Bancaire et Détection de Fraude
  description: |
    API hybride pour la détection de fraude bancaire combinant:
    - Machine Learning (XGBoost + Isolation Forest)
    - Règles métier (horaires, vélocité, device, géolocalisation)
    - Analyse de graphe (Neo4j - réseaux, comptes mules, PageRank)
    - Notifications temps réel (SSE)
  version: 2.2.0
  contact:
    name: API Support
    email: support@bankmatch.com
servers:
  - url: http://localhost:8005
    description: Serveur de développement local (FastAPI)
  - url: https://api.bankmatch.com/fraud
    description: Serveur de production

paths:
  /api/analyze:
    post:
      summary: Analyser des transactions pour détecter les fraudes
      operationId: analyzeTransactions
      security:
        - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TransactionInput'
            example:
              - tenant_id: "tenant-123"
                transaction_reference: "TX-10024"
                id: "TX-10024"
                date: "2026-07-16T14:30:00Z"
                description: "VIREMENT ENTRANT CASINO"
                amount: 1500.50
                sender_balance_before: 5000.0
                sender_balance_after: 3499.5
                receiver_balance_before: 200.0
                receiver_balance_after: 1700.5
                transaction_type: "TRANSFER"
                account_iban: "FR7612345678901234567890123"
                beneficiary_iban: "FR7698765432109876543210987"
                device_fingerprint: "abc123"
                country: "FR"
                city: "Paris"
      responses:
        '200':
          description: Analyse complétée avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeResponse'
              example:
                success: true
                data:
                  - tenant_id: "tenant-123"
                    transaction_reference: "TX-10024"
                    id: "TX-10024"
                    date: "2026-07-16T14:30:00Z"
                    description: "VIREMENT ENTRANT CASINO"
                    amount: 1500.50
                    isFraud: true
                    fraudProbability: 0.85
                    score: 85
                    confidence: "HIGH"
                    reconciliationStatus: "SUSPICIOUS"
                    ruleCategory: "MOTCLE_SENSIBLE"
                    explainability:
                      summary: "Bloqué par conformité : Mot-clé sensible détecté (LAB/FT)."
                      factors:
                        - "Mot-clé sensible détecté (LAB/FT)"
                        - "amount a contribué positivement"
                      shap_contributions:
                        - feature: "amount"
                          value: 0.23
                          direction: "positive"
        '400':
          description: Données de transaction invalides
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Données de transaction invalides"
        '401':
          description: Token d'authentification manquant ou invalide
        '429':
          description: Taux de requêtes dépassé (Rate limiting)
        '500':
          description: Erreur interne du serveur

  /api/analyze-demo:
    post:
      summary: Analyser des transactions pour détecter les fraudes (mode démo)
      description: Endpoint de démonstration sans authentification pour le développement
      operationId: analyzeTransactionsDemo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TransactionInput'
      responses:
        '200':
          description: Analyse complétée avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeResponse'
        '400':
          description: Données de transaction invalides
        '500':
          description: Erreur interne du serveur

  /api/config/thresholds:
    get:
      summary: Récupérer les seuils de configuration
      operationId: getThresholds
      security:
        - HTTPBearer: []
      responses:
        '200':
          description: Seuils récupérés avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThresholdsModel'
        '401':
          description: Token d'authentification manquant ou invalide
        '403':
          description: Permissions insuffisantes
        '500':
          description: Erreur interne du serveur
    put:
      summary: Mettre à jour les seuils de configuration
      operationId: updateThresholds
      security:
        - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThresholdsPatch'
      responses:
        '200':
          description: Seuils mis à jour avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThresholdsModel'
        '400':
          description: Données de seuils invalides
        '401':
          description: Token d'authentification manquant ou invalide
        '403':
          description: Permissions insuffisantes
        '500':
          description: Erreur interne du serveur

  /api/graph/top-accounts:
    get:
      summary: Récupérer les comptes les plus signalés
      operationId: getTopFlaggedAccounts
      security:
        - HTTPBearer: []
      parameters:
        - name: tenant_id
          in: query
          schema:
            type: string
          description: ID du tenant (optionnel)
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: Nombre maximum de résultats
      responses:
        '200':
          description: Liste des comptes signalés
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FlaggedAccount'

  /api/graph/mule-accounts:
    get:
      summary: Détecter les comptes mules
      operationId: detectMuleAccounts
      security:
        - HTTPBearer: []
      parameters:
        - name: tenant_id
          in: query
          schema:
            type: string
        - name: min_transactions
          in: query
          schema:
            type: integer
            default: 5
        - name: min_in_out_ratio
          in: query
          schema:
            type: number
            default: 0.7
        - name: max_delay_hours
          in: query
          schema:
            type: number
            default: 24
      responses:
        '200':
          description: Liste des comptes mules détectés
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MuleAccount'

  /api/graph/pagerank:
    get:
      summary: Calculer le PageRank des comptes
      operationId: computePageRank
      security:
        - HTTPBearer: []
      parameters:
        - name: tenant_id
          in: query
          schema:
            type: string
        - name: max_iterations
          in: query
          schema:
            type: integer
            default: 20
        - name: damping_factor
          in: query
          schema:
            type: number
            default: 0.85
      responses:
        '200':
          description: Scores PageRank calculés
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PageRankResult'

  /api/graph/communities:
    get:
      summary: Détecter les communautés de comptes
      operationId: detectCommunities
      security:
        - HTTPBearer: []
      parameters:
        - name: tenant_id
          in: query
          schema:
            type: string
        - name: min_community_size
          in: query
          schema:
            type: integer
            default: 3
      responses:
        '200':
          description: Communautés détectées
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Community'

  /api/notifications/stream:
    get:
      summary: Stream SSE pour notifications temps réel
      operationId: notificationStream
      security:
        - HTTPBearer: []
      responses:
        '200':
          description: Stream SSE établi
          content:
            text/event-stream:
              schema:
                type: string

  /api/reports:
    get:
      summary: Générer un rapport de détection de fraude
      operationId: getReports
      security:
        - HTTPBearer: []
      parameters:
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Date de début (format YYYY-MM-DD)
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Date de fin (format YYYY-MM-DD)
      responses:
        '200':
          description: Rapport généré avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportsData'
        '400':
          description: Paramètres invalides
        '401':
          description: Token d'authentification manquant ou invalide
        '500':
          description: Erreur interne du serveur

  /api/reports/categories:
    get:
      summary: Répartition des fraudes par catégorie
      operationId: getCategoryBreakdown
      security:
        - HTTPBearer: []
      parameters:
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Répartition par catégorie
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryBreakdown'
        '400':
          description: Paramètres invalides
        '401':
          description: Token d'authentification manquant ou invalide
        '500':
          description: Erreur interne du serveur

  /api/reports/timeseries:
    get:
      summary: Données temporelles de fraude
      operationId: getTimeSeriesData
      security:
        - HTTPBearer: []
      parameters:
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Données temporelles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeSeriesData'
        '400':
          description: Paramètres invalides
        '401':
          description: Token d'authentification manquant ou invalide
        '500':
          description: Erreur interne du serveur

  /api/reports/pdf:
    get:
      summary: Exporter le rapport en PDF
      operationId: exportPDF
      security:
        - HTTPBearer: []
      parameters:
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Fichier PDF généré
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Paramètres invalides
        '401':
          description: Token d'authentification manquant ou invalide
        '500':
          description: Erreur interne du serveur

  /api/reports/csv:
    get:
      summary: Exporter le rapport en CSV
      operationId: exportCSV
      security:
        - HTTPBearer: []
      parameters:
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Fichier CSV généré
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          description: Paramètres invalides
        '401':
          description: Token d'authentification manquant ou invalide
        '500':
          description: Erreur interne du serveur

  /api/notifications:
    get:
      summary: Récupérer les notifications de l'utilisateur
      operationId: getNotifications
      security:
        - HTTPBearer: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: unread_only
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Liste des notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '401':
          description: Token d'authentification manquant ou invalide
        '500':
          description: Erreur interne du serveur

  /api/notifications/{notification_id}/read:
    patch:
      summary: Marquer une notification comme lue
      operationId: markNotificationAsRead
      security:
        - HTTPBearer: []
      parameters:
        - name: notification_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification marquée comme lue
        '401':
          description: Token d'authentification manquant ou invalide
        '404':
          description: Notification non trouvée
        '500':
          description: Erreur interne du serveur

  /api/notifications/read-all:
    patch:
      summary: Marquer toutes les notifications comme lues
      operationId: markAllNotificationsAsRead
      security:
        - HTTPBearer: []
      responses:
        '200':
          description: Toutes les notifications marquées comme lues
        '401':
          description: Token d'authentification manquant ou invalide
        '500':
          description: Erreur interne du serveur

  /api/notifications/{notification_id}:
    delete:
      summary: Supprimer une notification
      operationId: deleteNotification
      security:
        - HTTPBearer: []
      parameters:
        - name: notification_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification supprimée
        '401':
          description: Token d'authentification manquant ou invalide
        '404':
          description: Notification non trouvée
        '500':
          description: Erreur interne du serveur

  /health:
    get:
      summary: Health check endpoint
      operationId: healthCheck
      responses:
        '200':
          description: Service en bonne santé
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                      service:
                        type: string
                        example: "fraud-detection"
                      version:
                        type: string
                        example: "2.2.0"
                      timestamp:
                        type: string
                        format: date-time

components:
  schemas:
    AnalyzeResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/TransactionOutput'

    ShapContribution:
      type: object
      required:
        - feature
        - value
        - direction
      properties:
        feature:
          type: string
        value:
          type: number
        direction:
          type: string
          enum: [positive, negative]

    TransactionInput:
      type: object
      required:
        - tenant_id
        - transaction_reference
        - id
        - date
        - description
        - amount
        - sender_balance_before
        - sender_balance_after
        - receiver_balance_before
        - receiver_balance_after
        - transaction_type
      properties:
        tenant_id:
          type: string
          example: "tenant-123"
        transaction_reference:
          type: string
          example: "TX-10024"
        id:
          type: string
          example: "TX-10024"
        date:
          type: string
          format: date-time
          example: "2026-07-16T14:30:00Z"
        description:
          type: string
          example: "VIREMENT ENTRANT CASINO"
        amount:
          type: number
          format: float
          example: 1500.50
        sender_balance_before:
          type: number
          format: float
          example: 5000.0
        sender_balance_after:
          type: number
          format: float
          example: 3499.5
        receiver_balance_before:
          type: number
          format: float
          example: 200.0
        receiver_balance_after:
          type: number
          format: float
          example: 1700.5
        transaction_type:
          type: string
          description: Type de transaction (TRANSFER, CASH_OUT, PAYMENT, etc.)
          example: "TRANSFER"
        account_iban:
          type: string
          nullable: true
        beneficiary_iban:
          type: string
          nullable: true
        sender_account:
          type: string
          nullable: true
        receiver_account:
          type: string
          nullable: true
        device_id:
          type: string
          nullable: true
        device_fingerprint:
          type: string
          nullable: true
        ip_address:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        city:
          type: string
          nullable: true

    Explainability:
      type: object
      required:
        - summary
        - factors
      properties:
        summary:
          type: string
        factors:
          type: array
          items:
            type: string
        shap_contributions:
          type: array
          items:
            $ref: '#/components/schemas/ShapContribution'
          default: []

    TransactionOutput:
      type: object
      required:
        - transaction_reference
        - id
        - date
        - description
        - amount
        - isFraud
        - fraudProbability
        - reconciliationStatus
        - explainability
      properties:
        tenant_id:
          type: string
          description: Ignoré si fourni - dérivé du token d'authentification côté serveur.
        transaction_reference:
          type: string
        id:
          type: string
        date:
          type: string
          format: date-time
        description:
          type: string
        amount:
          type: number
          format: float
        isFraud:
          type: boolean
          description: Flag indiquant si la transaction est suspecte
        fraudProbability:
          type: number
          format: float
          description: Probabilité de fraude (de 0.0 à 1.0)
        score:
          type: integer
          description: Score de risque (0-100)
        confidence:
          type: string
          enum: [HIGH, MEDIUM, LOW]
        reconciliationStatus:
          type: string
          enum: [MATCHED, UNMATCHED, SUSPICIOUS]
          description: Statut du rapprochement bancaire
        ruleCategory:
          type: string
          nullable: true
          default: NON_CATEGORISE
        explainability:
          $ref: '#/components/schemas/Explainability'

    ThresholdsModel:
      type: object
      properties:
        SEUIL_REGLEMENTAIRE:
          type: number
        SEUIL_APPROCHE_RATIO:
          type: number
        SEUIL_CASH_OUT:
          type: number
        SEUIL_MONTANT_ABERRANT:
          type: number
        RATIO_MONTANT_INHABITUEL:
          type: number
        SEUIL_JOURS_COMPTE_DORMANT:
          type: integer
        MOTS_CLES_SENSIBLES:
          type: array
          items:
            type: string

    ThresholdsPatch:
      type: object
      properties:
        SEUIL_REGLEMENTAIRE:
          type: number
        SEUIL_APPROCHE_RATIO:
          type: number
        SEUIL_CASH_OUT:
          type: number
        SEUIL_MONTANT_ABERRANT:
          type: number
        RATIO_MONTANT_INHABITUEL:
          type: number
        SEUIL_JOURS_COMPTE_DORMANT:
          type: integer
        MOTS_CLES_SENSIBLES:
          type: array
          items:
            type: string

    FlaggedAccount:
      type: object
      properties:
        iban:
          type: string
        alert_count:
          type: integer
        categories:
          type: array
          items:
            type: string

    MuleAccount:
      type: object
      properties:
        iban:
          type: string
        in_count:
          type: integer
        out_count:
          type: integer
        in_out_ratio:
          type: number
        avg_delay_hours:
          type: number

    PageRankResult:
      type: object
      properties:
        iban:
          type: string
        pagerank_score:
          type: number
        out_degree:
          type: integer
        in_degree:
          type: integer

    Community:
      type: object
      properties:
        center_account:
          type: string
        community_members:
          type: array
          items:
            type: string
        community_size:
          type: integer

    ReportsData:
      type: object
      properties:
        summary:
          $ref: '#/components/schemas/FraudSummary'
        categoryBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/CategoryBreakdown'
        timeSeriesData:
          type: array
          items:
            $ref: '#/components/schemas/TimeSeriesData'

    FraudSummary:
      type: object
      properties:
        total_transactions:
          type: integer
        fraud_detected:
          type: integer
        fraud_rate:
          type: number
          format: float
        total_amount:
          type: number
          format: float
        blocked_amount:
          type: number
          format: float

    CategoryBreakdown:
      type: object
      properties:
        category:
          type: string
        count:
          type: integer
        percentage:
          type: number
          format: float

    TimeSeriesData:
      type: object
      properties:
        date:
          type: string
          format: date
        fraud_count:
          type: integer
        total_count:
          type: integer

    Notification:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [critical, warning, info, success]
        title:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        read:
          type: boolean
          default: false
        icon:
          type: string
          nullable: true

  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT