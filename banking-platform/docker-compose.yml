version: "3.9"

services:

  neo4j_db:
    image: neo4j:5.26-community
    container_name: neo4j_db
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password_super_securise
    volumes:
      - neo4j_data:/data
    networks:
      - banking_net

  fraud-service:
    build: ../fraud_detection/backend
    container_name: fraud_service
    ports:
      - "8005:8005"
    environment:
      - NEO4J_URI=bolt://neo4j_db:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password_super_securise
      - INTERNAL_SERVICE_SECRET=internal_dev_secret
      - DISABLE_INTERNAL_AUTH=false
    depends_on:
      - neo4j_db
    networks:
      - banking_net

  multi-banking:
    build: ../multi-banking
    container_name: multi_banking
    ports:
      - "8010:8010"
    environment:
      - FRAUD_SERVICE_URL=http://fraud-service:8005
      - INTERNAL_SERVICE_SECRET=internal_dev_secret
      - DISABLE_INTERNAL_AUTH=false
    depends_on:
      - fraud-service
    networks:
      - banking_net
  api-gateway:
    image: nginx:latest
    container_name: api_gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - multi-banking
      - fraud-service
    networks:
      - banking_net

networks:
  banking_net:

volumes:
  neo4j_data: