<aside 
  [style.width]="isCollapsed() ? '5rem' : '16rem'"
  style="background-color: white; border-right: 1px solid #e5e7eb; height: 100vh; display: flex; flex-direction: column; transition: all 0.3s ease-in-out; position: fixed; left: 0; top: 0; z-index: 40;"
>
  <!-- Logo -->
  <div style="padding: 1rem; border-bottom: 1px solid #e5e7eb;">
    <div style="display: flex; align-items: center; gap: 0.75rem;">
      <div style="height: 2.5rem; width: 2.5rem; background: linear-gradient(to bottom right, #2563eb, #1e3a8a); border-radius: 0.75rem; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 1.125rem;">
        BM
      </div>
      @if (!isCollapsed()) {
        <div>
          <h1 style="font-weight: bold; color: #1f2937; font-size: 1.125rem;">BankMatch</h1>
          <p style="font-size: 0.75rem; color: #6b7280;">Fraud Detection</p>
        </div>
      }
    </div>
  </div>

  <!-- Navigation -->
  <nav style="flex: 1; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; overflow-y: auto;">
    @for (item of menuItems; track $index) {
      <a
        [routerLink]="item.path"
        routerLinkActive="active-link"
        style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: 0.5rem; color: #4b5563; text-decoration: none; transition: background-color 0.2s;"
        class="sidebar-link"
      >
        <span style="font-size: 1.25rem;">{{ item.icon }}</span>
        @if (!isCollapsed()) {
          <div style="flex: 1;">
            <p style="font-weight: 500; font-size: 0.875rem;">{{ item.label }}</p>
            <p style="font-size: 0.75rem; color: #9ca3af;">{{ item.description }}</p>
          </div>
        }
      </a>
    }
  </nav>

  <!-- Toggle Button -->
  <div style="padding: 1rem; border-top: 1px solid #e5e7eb;">
    <button
      (click)="toggleCollapse()"
      style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.5rem 1rem; border-radius: 0.5rem; color: #4b5563; background: none; border: none; cursor: pointer; transition: background-color 0.2s;"
      class="sidebar-toggle"
    >
      @if (isCollapsed()) {
        <span style="font-size: 1.25rem;">→</span>
      } @else {
        <span style="font-size: 1.25rem;">←</span>
        <span style="font-size: 0.875rem;">Réduire</span>
      }
    </button>
  </div>
</aside>
